name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/fastapi-ticket-api
  pull_request:
    branches:
      - main

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Codequalität mit Ruff prüfen
        run: |
          ruff check app tests

      - name: Tests mit pytest ausführen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest

      # Das Docker-Image wird nur gebaut, aber nicht veröffentlicht.
      - name: Docker Image bauen
        run: |
          docker build -t a2z-servicedesk:ci .
