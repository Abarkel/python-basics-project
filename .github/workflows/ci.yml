name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/fastapi-ticket-api
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Codequalität mit Ruff prüfen
        run: |
          ruff check app tests

      - name: Tests mit pytest ausführen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest

      - name: Docker Image bauen
        run: |
          docker build \
            -t ghcr.io/DEIN-GITHUB-NAME/a2z-servicedesk:${{ github.sha }} \
            -t ghcr.io/DEIN-GITHUB-NAME/a2z-servicedesk:ci .

      - name: Login bei GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Docker Image veröffentlichen
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/DEIN-GITHUB-NAME/a2z-servicedesk:${{ github.sha }}
          docker push ghcr.io/DEIN-GITHUB-NAME/a2z-servicedesk:ci
